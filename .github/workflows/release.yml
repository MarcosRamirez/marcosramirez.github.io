name: Release

on:
  push:
    branches: [main]
  # Permite relanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Crear tags y releases necesita escritura; el deploy de Pages no.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Ver si el tag ya existe
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar la release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          node scripts/release-notes.mjs "$version" > notas.md
          gh release create "v$version" \
            --title "$version" \
            --notes-file notas.md \
            --target "$GITHUB_SHA"
